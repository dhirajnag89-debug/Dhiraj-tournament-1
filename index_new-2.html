<style>
:root{--maxw:448px;--bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--sub:#8e8e93;--line:#e5e5ea;--shadow:0 2px 20px rgba(0,0,0,.06);--head:rgba(255,255,255,.92);--inp:#fff;--chip:#e9e9ef;--blue:#007AFF;--green:#34C759;--red:#FF3B30;--orange:#FF9500;--purple:#AF52DE;--gold:#FFD700;--ease:cubic-bezier(.25,.46,.45,.94)}
[data-theme=dark]{--bg:#0a0a0f;--card:#1c1c1e;--text:#f2f2f7;--sub:#98989f;--line:#38383a;--shadow:0 2px 20px rgba(0,0,0,.45);--head:rgba(28,28,30,.92);--inp:#2c2c2e;--chip:#2c2c2e}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,"SF Pro Display",BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-weight:500;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
*{transition:background-color .3s var(--ease),color .3s var(--ease),border-color .3s var(--ease);box-sizing:border-box}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
.hd{font-weight:800;letter-spacing:-.5px}.sub{color:var(--sub)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
.btn{border-radius:12px;font-weight:700;min-height:44px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;color:#fff;transition:transform .3s var(--ease),opacity .3s var(--ease),background-color .3s var(--ease)}
.btn:active,.press:active{transform:scale(.97);opacity:.9}
.btn:disabled{opacity:.55;pointer-events:none}
.b-blue{background:var(--blue)}.b-green{background:var(--green)}.b-red{background:var(--red)}.b-orange{background:var(--orange)}.b-purple{background:var(--purple)}.b-gray{background:#8e8e93}.b-soft{background:var(--chip);color:var(--text)}
.b-live{background:var(--green);animation:livepulse 1.6s infinite}
.inp{width:100%;border-radius:10px;border:1.5px solid var(--line);background:var(--inp);color:var(--text);padding:0 14px;min-height:46px;outline:none;font-weight:500;transition:border-color .3s var(--ease),box-shadow .3s var(--ease)}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.12)}.inp.err{border-color:var(--red)}
textarea.inp{padding:12px 14px;min-height:90px}
.fld{margin-bottom:14px}.fld label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.errmsg{color:var(--red);font-size:12px;margin-top:4px;font-weight:600}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex:none}
.chip{padding:0 14px;border-radius:999px;background:var(--chip);font-weight:700;font-size:13px;white-space:nowrap;min-height:36px;border:0;color:var(--text);display:inline-flex;align-items:center}
.chip.on{background:var(--blue);color:#fff}
.sec-h{font-weight:800;font-size:17px;letter-spacing:-.3px;margin-bottom:12px}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;width:var(--w);background:var(--blue);animation:grow .9s var(--ease)}
.na .bar>i,.na .fu{animation:none}
@keyframes grow{from{width:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes livepulse{0%,100%{box-shadow:0 0 0 0 rgba(52,199,89,.5)}50%{box-shadow:0 0 0 9px rgba(52,199,89,0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(0,122,255,.0),0 6px 24px rgba(0,122,255,.25)}50%{box-shadow:0 0 22px 4px rgba(0,122,255,.45),0 6px 24px rgba(0,122,255,.3)}}
@keyframes heroShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes marq{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
@keyframes fire{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.25) rotate(4deg)}}
@keyframes slideR{from{transform:translateX(120%);opacity:0}to{transform:none;opacity:1}}
.fu{animation:fadeUp .5s var(--ease) both;animation-delay:calc(var(--i,0)*60ms)}
.shake{animation:shake .45s}.pop{animation:pop .5s var(--ease) both;animation-delay:var(--d,0ms)}.vfade{animation:fadeIn .3s var(--ease)}
.blink{animation:blink 1.2s infinite}.spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
.spinner.dk{border-color:var(--line);border-top-color:var(--blue)}
#hdr{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--maxw);z-index:40;background:var(--head);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:env(safe-area-inset-top) 10px 0;height:calc(56px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid var(--line)}
.ib{width:40px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:0;color:var(--text);position:relative}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#007AFF,#AF52DE);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;overflow:hidden}
.wchip{background:var(--chip);border-radius:999px;padding:0 10px;height:32px;display:flex;align-items:center;font-weight:800;font-size:13px;gap:3px;border:0;color:var(--text)}
.dot{position:absolute;top:8px;right:6px;min-width:16px;height:16px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
#view{max-width:var(--maxw);margin:0 auto;padding-top:calc(60px + env(safe-area-inset-top));padding-bottom:calc(96px + env(safe-area-inset-bottom));min-height:100vh}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--maxw);z-index:40;background:var(--head);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);height:calc(62px + env(safe-area-inset-bottom))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:700;color:var(--sub);background:none;border:0;min-height:56px;position:relative;transition:color .3s var(--ease),transform .3s var(--ease)}
.tab.on{color:var(--blue)}.tab:active{transform:scale(.93)}
.tab.mid{overflow:visible}.tab.mid .circ{width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;position:absolute;top:-20px;animation:glow 2.4s infinite;border:4px solid var(--bg)}
.tab.mid span{margin-top:34px}.tab.mid.on span{color:var(--blue)}
.nbadge{position:absolute;top:8px;right:calc(50% - 20px);width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid var(--card)}
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translate(-50%,-140%);z-index:300;max-width:min(92vw,420px);padding:12px 18px;border-radius:14px;background:#1c1c1e;color:#fff;font-weight:600;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.3);transition:transform .45s cubic-bezier(.34,1.4,.64,1)}
.toast.on{transform:translate(-50%,0)}.toast.success{background:#248a3d}.toast.error{background:#d70015}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80;opacity:0;transition:opacity .3s var(--ease)}.ov.on{opacity:1}
.sh{position:fixed;left:50%;bottom:0;width:100%;max-width:var(--maxw);transform:translate(-50%,105%);background:var(--card);border-radius:24px 24px 0 0;z-index:81;max-height:92vh;overflow:auto;padding:8px 16px calc(22px + env(safe-area-inset-bottom));transition:transform .5s cubic-bezier(.34,1.25,.64,1)}
.sh.on{transform:translate(-50%,0)}.grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.pg{position:fixed;inset:0;max-width:var(--maxw);margin:0 auto;background:var(--bg);z-index:60;overflow:auto;transform:translateY(100%);transition:transform .4s var(--ease)}.pg.on{transform:none}
.pghead{position:sticky;top:0;z-index:5;background:var(--head);backdrop-filter:blur(20px);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:8px;border-bottom:.5px solid var(--line)}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:12px;padding:3px}
.seg button{position:relative;z-index:1;min-height:40px;border:0;background:none;font-weight:700;color:var(--sub);transition:color .3s}.seg button.on{color:var(--text)}
.seg i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--card);border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.12);transition:transform .35s var(--ease)}.seg.up i{transform:translateX(100%)}
.authgrid{display:grid;overflow:hidden}.af{grid-area:1/1;opacity:0;pointer-events:none;visibility:hidden;transition:transform .4s var(--ease),opacity .4s var(--ease),visibility .4s}
#fIn:not(.on){transform:translateX(-40px)}#fUp:not(.on){transform:translateX(40px)}.af.on{opacity:1;pointer-events:auto;visibility:visible;transform:none}
.hero{position:relative;border-radius:20px;overflow:hidden;min-height:150px;background:linear-gradient(120deg,#007AFF,#AF52DE,#FF9500,#007AFF);background-size:300% 300%;animation:heroShift 8s ease infinite,glow 3s infinite;color:#fff;display:flex;align-items:flex-end}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.marq{overflow:hidden;white-space:nowrap;border-radius:12px;padding:9px 0;font-weight:700;font-size:13px;background:var(--card);box-shadow:var(--shadow)}.marq span{display:inline-block;animation:marq 16s linear infinite;padding-left:100%}
.scroller{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px}.scroller::-webkit-scrollbar{display:none}
.stat{min-width:140px;flex:1;padding:14px}
.stripe{height:5px}
.gl{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.tag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px}
.slotgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-height:170px;overflow:auto;padding:2px}
.slotgrid button{height:36px;border-radius:9px;border:1.5px solid var(--line);background:var(--inp);color:var(--text);font-weight:700;font-size:12px}
.slotgrid button.sel{background:var(--blue);border-color:var(--blue);color:#fff}.slotgrid button:disabled{opacity:.3;text-decoration:line-through}
#holdBtn{position:relative;width:96px;height:96px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 8px 24px rgba(0,122,255,.4)}
#holdBtn svg{position:absolute;inset:-6px;width:108px;height:108px;transform:rotate(-90deg)}#holdBtn.holding{transform:scale(.95)}#holdBtn.holding circle{transition:none}
.ring{fill:none;stroke:var(--green);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .25s}
.win{position:fixed;inset:0;z-index:250;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;text-align:center;animation:fadeIn .3s}
.sw{width:51px;height:31px;border-radius:99px;background:var(--chip);position:relative;border:0;flex:none;transition:background-color .3s}.sw::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .3s var(--ease)}.sw.on{background:var(--green)}.sw.on::after{transform:translateX(20px)}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:52px;border-bottom:.5px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;color:var(--text);text-align:left;font-weight:600}
.row:last-child{border-bottom:0}
.bdg{border-radius:16px;padding:14px;text-align:center;background:var(--card);box-shadow:var(--shadow);border:0;color:var(--text);position:relative}
.bdg.lock .bi{filter:grayscale(1);opacity:.4}.bdg.ok{box-shadow:0 0 18px rgba(255,215,0,.45),var(--shadow);animation:pop .6s var(--ease) both}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px}
.pcard{flex:1;border-radius:18px;padding:12px 6px;text-align:center;color:#1c1c1e;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.gold{background:linear-gradient(160deg,#FFE66D,#FFB800)}.silver{background:linear-gradient(160deg,#F1F1F6,#B0B0BA)}.bronze{background:linear-gradient(160deg,#E9A872,#B8733A)}
.chatbox{height:200px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:4px}
.msg{max-width:82%;padding:7px 11px;border-radius:14px;background:var(--chip);font-size:14px;word-break:break-word}.msg.me{align-self:flex-end;background:var(--blue);color:#fff}
.msg small{display:block;font-size:10px;opacity:.7;font-weight:700}
#killfeed{position:fixed;right:10px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:45;pointer-events:none}
.kf{background:#1c1c1e;color:#fff;border-radius:14px;padding:10px 14px;font-weight:700;font-size:13px;max-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:slideR .45s var(--ease)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:400}
#splash,#ban{position:fixed;inset:0;z-index:500;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#splash.hide{opacity:0;pointer-events:none;transition:opacity .4s}
.hidden{display:none!important}
.fire{display:inline-block;animation:fire 1s infinite}
.wheelwrap{position:relative;width:260px;height:260px;margin:8px auto}.ptr{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:26px solid var(--red);z-index:3;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.scratch{position:relative;width:280px;height:140px;margin:10px auto;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#FFE66D,#FF9500);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:#1c1c1e}
.scratch canvas{position:absolute;inset:0;touch-action:none;transition:opacity .6s}
#ptrbox{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:height .2s}
.tabs2{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:12px;padding:3px}.tabs2 button{min-height:38px;border:0;background:none;border-radius:10px;font-weight:700;color:var(--sub)}.tabs2 button.on{background:var(--card);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.uapp{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:var(--text);font-size:10.5px;font-weight:700;padding:6px 0;min-height:70px;text-align:center}
.uapp i{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-weight:800;font-size:20px;box-shadow:0 4px 12px rgba(0,0,0,.18);transition:transform .3s var(--ease)}
.uapp:active i{transform:scale(.9)}
.uapp i{position:relative;overflow:hidden}

.uapp i.lg{background:#fff}.uapp i img.lg{padding:0;background:none}
.uapp{border-radius:14px;transition:background-color .2s}.uapp:active{background:var(--chip)}
.famcard{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:18px;padding:12px 14px;background:linear-gradient(135deg,#1a1205,#3a2508);color:#fff;text-align:left;position:relative;overflow:hidden;box-shadow:0 6px 22px rgba(245,166,35,.35)}
.famcard:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,200,90,.25) 50%,transparent 70%);transform:translateX(-120%);animation:shine 3s infinite}
@keyframes shine{to{transform:translateX(120%)}}
.famcard img{width:46px;height:46px;border-radius:14px;flex:none}
.famcard b{display:block;font-size:15px}.famcard small{opacity:.8;font-weight:600;font-size:11.5px}
.famcard .go{margin-left:auto;background:#F5A623;color:#1a1205;font-weight:800;font-size:12px;padding:8px 12px;border-radius:99px}
.logos-row{display:flex;justify-content:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.logos-row img{width:34px;height:34px;border-radius:11px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.qtabs{display:inline-flex;background:var(--chip);border-radius:99px;padding:3px;margin-bottom:12px}
.qtabs button{border:0;background:none;color:var(--text);font-weight:700;font-size:12px;padding:7px 14px;border-radius:99px}
.qtabs button.on{background:#F5A623;color:#1a1205}
.paypulse{animation:glow 1.4s infinite}
.uapp i img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:7px}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:820px){:root{--maxw:100%}}
</style>

<body>
<div id="splash"><div class="logo" style="width:72px;height:72px;font-size:38px;border-radius:20px">🎮</div><div class="spinner dk mt-6"></div></div>

<section id="auth" class="fixed inset-0 z-50 overflow-auto hidden" style="background:var(--card)">
 <div class="mx-auto px-6 pt-12 pb-10" style="max-width:var(--maxw)">
  <div class="text-center fu">
   <div class="logo mx-auto" style="width:76px;height:76px;font-size:40px;border-radius:22px">🎮</div>
   <h1 class="hd text-3xl mt-3 authName">Esports Arena</h1>
   <p class="sub mt-1" data-en="Play. Compete. Win." data-hi="खेलो. जीतो. कमाओ."></p>
  </div>
  <div class="seg mt-8" id="seg"><i></i><button type="button" class="on" data-act="authMode" data-m="in" data-en="Sign In" data-hi="साइन इन"></button><button type="button" data-act="authMode" data-m="up" data-en="Sign Up" data-hi="साइन अप"></button></div>
  <div class="authgrid mt-6" id="authGrid">
   <form id="fIn" class="af on" novalidate>

const ids=S.mm.filter(x=>stOf(x.m)==='ended').map(x=>x.m.id);const s=seenRes();ids.forEach(i=>{if(!s.includes(i))s.push(i)});localStorage.setItem('seenRes',JSON.stringify(s));computeBadge()}
function drawMM(){const l=$('#mmList');if(!l)return;const L=S.mm.filter(x=>S.mf==='all'||stOf(x.m)===S.mf);if(!L.length){l.innerHTML=`<div class="card p-8 text-center sub fu"><div style="font-size:40px">🎯</div><div class="font-bold mt-2">${T('No matches yet','अभी कोई मैच नहीं')}</div></div>`;return}l.innerHTML='<div class="space-y-3">'+L.map((x,i)=>{const m=x.m,st=stOf(m),r=normRes(m).find(q=>q.uid===S.uid),cl=st==='playing'?['var(--red)','🔴 LIVE']:st==='ended'?['var(--sub)',T('ENDED','समाप्त')]:['var(--blue)',T('UPCOMING','आगामी')];return `<div class="card p-4 press fu" style="--i:${Math.min(i,8)}" data-act="${st==='ended'?'results':'lobby'}" data-id="${m.id}"><div class="flex items-start justify-between gap-2"><div class="min-w-0"><div class="hd truncate" style="font-size:16px">${esc(m.title)}</div><div class="sub text-xs font-semibold">${esc(m.game||'')} · ${fmtWhen(m.startTime)}</div></div><span class="tag" style="background:${cl[0]};color:#fff;white-space:nowrap">${cl[1]}</span></div><div class="flex flex-wrap gap-2 mt-3 text-xs font-bold"><span class="tag" style="background:var(--chip)">${T('Fee','फीस')} ${rupee(x.j.fee)}</span><span class="tag" style="background:var(--chip)">${T('Slot','स्लॉट')} #${x.j.slot}</span>${r&&r.prize>0?`<span class="tag" style="background:rgba(52,199,89,.15);color:var(--green)">🏆 ${rupee(r.prize)}</span>`:''}${r&&r.killEarnings>0?`<span class="tag" style="background:rgba(255,59,48,.12);color:var(--red)">💀 ${rupee(r.killEarnings)}</span>`:''}</div></div>`}).join('')+'</div>'}
function syncStats(){const u=S.user;if(!u)return;let wins=0,km=0,sharp=0;S.mm.forEach(x=>{if(stOf(x.m)!=='ended')return;const R=normRes(x.m),me=R.find(r=>r.uid===S.uid);if(!me)return;if(me.position===1)wins++;if(me.killEarnings>0){km++;const mx=Math.max(...R.map(r=>r.killEarnings));if(me.killEarnings>=mx)sharp=1}});const upd={};if(wins!==(+u.statWins||0)&&wins>(+u.statWins||0))upd.statWins=wins;if(km>(+u.statKillMatches||0))upd.statKillMatches=km;if(sharp&&!u.statSharp)upd.statSharp=true;if(Object.keys(upd).length)db.collection('users').doc(S.uid).update(upd).catch(()=>{})}
let ptr={y:0,on:false,d:0};

function renderPlay(){$('#view').innerHTML=`<div class="px-4 pt-3"><h1 class="hd text-3xl mb-3 fu">🏆 ${T('Leaderboard','लीडरबोर्ड')}</h1><div class="tabs2 mb-4 fu" style="--i:1"><button data-act="lbtab" data-t="w" class="${S.lb.tab==='w'?'on':''}">${T('Top Winners','टॉप विनर्स')}</button><button data-act="lbtab" data-t="p" class="${S.lb.tab==='p'?'on':''}">${T('Top Players','टॉप प्लेयर्स')}</button></div><div id="lbBox"><div class="text-center p-8"><span class="spinner dk"></span></div></div></div>`;loadLB()}
ACT.lbtab=d=>{S.lb.tab=d.t;$$('.tabs2 button').forEach(b=>b.classList.toggle('on',b.dataset.t===d.t));drawLB()};
async function loadLB(){try{const [w,p]=await Promise.all([db.collection('users').orderBy('totalWon','desc').limit(10).get(),db.collection('users').orderBy('matchesPlayed','desc').limit(10).get()]);const mk=s=>s.docs.map(d=>Object.assign({id:d.id},d.data())).filter(u=>u.status!=='banned');S.lb.w=mk(w);S.lb.p=mk(p);S.lb.myRank={};drawLB();for(const [k,f] of [['w','totalWon'],['p','matchesPlayed']]){const list=S.lb[k];if(!list.some(u=>u.id===S.uid)){try{const q=await db.collection('users').where(f,'>',+S.user[f]||0).limit(500).get();S.lb.myRank[k]=q.size>=500?'500+':q.size+1;if(S.tab==='play')drawLB()}catch(e){}}}}catch(e){const b=$('#lbBox');if(b)b.innerHTML=`<div class="card p-6 text-center sub">${T('Failed to load','लोड नहीं हुआ')}</div>`}}
function drawLB(){const b=$('#lbBox');if(!b)return;const k=S.lb.tab,f=k==='w'?'totalWon':'matchesPlayed',L=S.lb[k],fmt=k==='w'?rupee:(n=>num(n)+' '+T('matches','मैच'));const row=(u,i,me,rankLbl)=>{const t=tierOf(u.matchesPlayed),med=['🥇','🥈','🥉'][i];return `<div class="flex items-center gap-3 p-3 fu ${me?'':''}" style="--i:${Math.min(i,9)};${me?'background:rgba(0,122,255,.1);border-radius:14px':''}"><div class="text-center font-extrabold" style="width:30px;font-size:${med?22:15}px">${rankLbl||med||i+1}</div>${av(u.username,u.avatarColor,40)}<div class="flex-1 min-w-0"><div class="font-bold truncate">${esc(u.username)}${me?` <span class="tag" style="background:var(--blue);color:#fff">${T('YOU','आप')}</span>`:''}</div><div class="text-xs font-bold" style="color:${t.c}">${t.ic} ${tName(t)}</div></div><div class="hd lbv" data-v="${+u[f]||0}" style="color:${k==='w'?'var(--green)':'var(--text)'}">${fmt(0)}</div></div>`};
let h=`<div class="card overflow-hidden" id="lbCard">${L.length?L.map((u,i)=>row(u,i,u.id===S.uid)).join(''):`<div class="p-8 text-center sub">${T('No data yet','अभी कोई डेटा नहीं')}</div>`}</div>`;
if(!L.some(u=>u.id===S.uid)&&S.user)h+=`<div style="position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));margin-top:12px" class="card">${row(S.user,0,true,'#'+(S.lb.myRank&&S.lb.myRank[k]||'…'))}</div>`;b.innerHTML=h;$$('.lbv',b).forEach(el=>animNum(el,+el.dataset.v,0,fmt,900))}

function updWalCard(){const b=$('#walCard'),u=S.user;if(!b||!u)return;const vip=(+u.totalAdded||0)>=500;b.innerHTML=`<div class="card p-5" style="background:linear-gradient(135deg,#007AFF,#5856D6);color:#fff"><div class="flex justify-between items-start"><div class="text-sm font-bold opacity-90">${T('Available Balance','उपलब्ध बैलेंस')}</div>${vip?`<span class="tag" style="background:rgba(255,215,0,.95);color:#1c1c1e">VIP ⭐</span>`:''}</div><div class="hd mt-1" style="font-size:40px" id="walBal">${rupee(0)}</div>${+u.lockedBalance>0?`<div class="text-xs font-bold mt-1 opacity-90">🔒 ${rupee(u.lockedBalance)} ${T('locked (pending withdrawal)','लॉक (पेंडिंग निकासी)')}</div>`:''}<div class="grid grid-cols-2 gap-3 mt-4"><button class="btn" style="background:#fff;color:#007AFF" data-act="addMoney">＋ ${T('Add Money','पैसे जोड़ें')}</button><button class="btn" style="background:rgba(255,255,255,.22)" data-act="withdraw">↗ ${T('Withdraw','निकालें')}</button></div></div>`;animNum($('#walBal'),+u.wallet||0,S.walShown||0,rupee,900);S.walShown=+u.wallet||0}

async function loadTx(){try{const s=await db.collection('users').doc(S.uid).collection('transactions').orderBy('ts','desc').limit(200).get();S.tx=s.docs.map(d=>Object.assign({id:d.id},d.data()));drawTx()}catch(e){const l=$('#txList');if(l)l.innerHTML=`<div class="p-6 text-center sub">${T('Failed to load','लोड नहीं हुआ')}</div>`}}
const TXI={added:['➕','var(--green)'],won:['🏆','var(--green)'],spent:['🎮','var(--red)'],withdrawn:['↗️','var(--red)'],bonus:['🎁','var(--orange)']};
function dayGroup(t){const d=new Date(t),n=new Date(),dd=Math.floor((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);return dd<=0?T('Today','आज'):dd===1?T('Yesterday','कल'):dd<7?T('This Week','इस हफ्ते'):T('Older','पुराने')}
function drawTx(){const l=$('#txList');if(!l)return;const all=S.tx.filter(x=>S.txf==='all'||x.type===S.txf);if(!all.length){l.innerHTML=`<div class="p-6 text-center sub">${T('No transactions','कोई लेन-देन नहीं')}</div>`;return}const L=all.slice(0,S.txShow);let last='',h='';L.forEach(x=>{const t=x.ts?ms(x.ts):Date.now(),g=dayGroup(t);if(g!==last){h+=`<div class="sub text-xs font-extrabold mt-3 mb-1 uppercase">${g}</div>`;last=g}const i=TXI[x.type]||['💳','var(--text)'],a=+x.amount||0;h+=`<div class="press" data-act="txrow" data-id="${x.id}" style="border-bottom:.5px solid var(--line)"><div class="flex items-center gap-3 py-3"><div class="gl" style="width:38px;height:38px;font-size:18px;background:var(--bg)">${i[0]}</div><div class="flex-1 min-w-0"><div class="font-bold truncate text-sm">${esc(x.desc||x.type)}</div><div class="sub text-xs">${new Date(t).toLocaleString(lang==='hi'?'hi-IN':'en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}</div></div><div class="font-extrabold" style="color:${a>=0?'var(--green)':'var(--red)'}">${a>=0?'+':'−'}${rupee(Math.abs(a))}</div></div><div class="hidden text-xs sub pb-3 pl-12" id="tx_${x.id}">${T('Type','प्रकार')}: ${esc(x.type)}<br>ID: ${x.id}<br>${new Date(t).toLocaleString()}${x.status?'<br>'+T('Status','स्थिति')+': '+esc(x.status):''}</div></div>`});if(all.length>S.txShow)h+=`<button class="btn b-soft w-full mt-3" data-act="txmore">${T('Load More','और लोड करें')}</button>`;l.innerHTML=h}
ACT.txmore=()=>{S.txShow+=10;drawTx()};ACT.txrow=d=>{const e=$('#tx_'+d.id);if(e)e.classList.toggle('hidden')};
async function loadWd(){try{const s=await db.collection('withdrawRequests').where('uid','==',S.uid).get();const L=s.docs.map(d=>Object.assign({id:d.id},d.data())).filter(x=>x.status==='pending').sort((a,b)=>ms(b.ts)-ms(a.ts));const b=$('#wdReqs');if(!b)return;b.innerHTML=L.length?`<div class="card p-4 fu"><div class="sec-h" style="margin-bottom:8px">⏳ ${T('Pending Withdrawals','पेंडिंग निकासी')}</div>${L.map(x=>`<div class="flex justify-between items-center py-2 text-sm"><div><div class="font-bold">${rupee(x.amount)} → ${esc(x.upi)}</div><div class="sub text-xs">${T('Expected within 24 hours','24 घंटे में अपेक्षित')}</div></div><span class="tag" style="background:rgba(255,149,0,.15);color:var(--orange)">${T('Pending','पेंडिंग')}</span></div>`).join('')}</div>`:''}catch(e){}}
ACT.promo=async(d,btn)=>{const code=($('#promoIn').value||'').trim().toUpperCase().replace(/[^A-Z0-9_-]/g,'');if(!code)return;loading(btn,true);const pRef=db.collection('promoCodes').doc(code),uRef=db.collection('users').doc(S.uid),usedRef=uRef.collection('promoUsed').doc(code);let amt=0;try{await db.runTransaction(async tx=>{const p=await tx.get(pRef);if(!p.exists||p.data().active===false)throw new Error('BAD');const pd=p.data();if(pd.expiresAt&&ms(pd.expiresAt)<Date.now())throw new Error('BAD');const us=await tx.get(usedRef);if(us.exists)throw new Error('USED');const u=(await tx.get(uRef)).data();amt=+pd.amount||0;if(amt<=0)throw new Error('BAD');tx.update(uRef,{wallet:(+u.wallet||0)+amt});tx.set(usedRef,{ts:FV.serverTimestamp(),amount:amt});tx.set(uRef.collection('transactions').doc(),{type:'bonus',amount:amt,desc:T('Promo code ','प्रोमो कोड ')+code,ts:FV.serverTimestamp()})});confetti();toast(T('Promo applied! +','प्रोमो लगा! +')+rupee(amt),'success');$('#promoIn').value='';loadTx()}catch(e){toast(e.message==='USED'?T('You already used this code','आप यह कोड पहले इस्तेमाल कर चुके हैं'):T('Invalid or expired code','अमान्य या एक्सपायर्ड कोड'),'error')}loading(btn,false)};

ACT.withdraw=()=>{const sh=sheet('');let otp=null,otpAt=0;const draw=()=>sh.set(`<div class="hd text-xl text-center mb-4">${T('Withdraw Money','पैसे निकालें')}</div>${S.user.kycVerified?'':`<div class="rounded-xl p-3 mb-3 text-sm font-semibold" style="background:rgba(255,149,0,.14);color:var(--orange)">⚠️ ${T('KYC not verified — payouts may take longer.','KYC सत्यापित नहीं — भुगतान में देरी हो सकती है।')}</div>`}<div class="fld"><label>UPI ID</label><input id="wUpi" class="inp" autocapitalize="off" placeholder="name@bank"><div class="errmsg" id="wUpiE"></div></div><div class="fld"><label>${T('Amount (₹50 – ₹10,000)','राशि (₹50 – ₹10,000)')}</label><input id="wAmt" class="inp" inputmode="numeric"><div class="errmsg" id="wAmtE"></div></div><button class="btn b-blue w-full" id="wSend">${T('Send OTP','OTP भेजें')}</button><div id="wOtpBox" class="hidden mt-4"><div class="fld"><label>${T('Enter 6-digit OTP','6 अंकों का OTP दर्ज करें')}</label><input id="wOtp" class="inp mono text-center" inputmode="numeric" maxlength="6" style="font-size:24px;letter-spacing:8px"><div class="errmsg" id="wOtpE"></div></div></div>`);draw();const R=s=>$(s,sh.el);

const wpick=a=>{let r=Math.random()*a.reduce((s,x)=>s+x.w,0);for(let i=0;i<a.length;i++){r-=a[i].w;if(r<=0)return i}return 0};
async function creditDaily(kind,prize){const uRef=db.collection('users').doc(S.uid),fld=kind==='spin'?'lastSpinDate':'lastScratchDate';await db.runTransaction(async tx=>{const u=(await tx.get(uRef)).data();if(u[fld]===todayStr())throw new Error('DONE');const upd={[fld]:todayStr()};if(prize>0)upd.wallet=(+u.wallet||0)+prize;tx.update(uRef,upd);if(prize>0)tx.set(uRef.collection('transactions').doc(),{type:'bonus',amount:prize,desc:kind==='spin'?T('Lucky spin reward','लकी स्पिन इनाम'):T('Scratch card reward','स्क्रैच कार्ड इनाम'),ts:FV.serverTimestamp()})});if(prize>0)addNote(kind,kind==='spin'?T('🎁 You spun ₹'+prize+'!','🎁 आपने ₹'+prize+' जीते!'):T('🎁 Scratch card: ₹'+prize+' won!','🎁 स्क्रैच कार्ड: ₹'+prize+' जीते!'))}

ACT.scratch=()=>{const done=S.user.lastScratchDate===todayStr();const sh=sheet(`<div class="text-center"><div class="hd text-xl">🎟️ ${T('Scratch Card','स्क्रैच कार्ड')}</div><div class="sub text-sm">${T('One scratch per day','दिन में एक स्क्रैच')}</div>${done?`<div class="card p-8 mt-4" style="background:var(--bg);box-shadow:none"><div style="font-size:44px">✅</div><div class="font-bold mt-2">${T('Come back tomorrow','कल फिर आएं')}</div></div>`:`<div class="scratch" id="scrBox"><span id="scrPrize">?</span><canvas id="scrCv" width="280" height="140"></canvas></div><div class="sub text-sm" id="scrHint">${T('Scratch with your finger','उंगली से स्क्रैच करें')}</div><div id="scrRes" class="hd text-xl mt-2" style="min-height:30px"></div>`}<button class="btn b-soft w-full mt-4" data-act="close">${T('Close','बंद करें')}</button></div>`);if(done)return;const cv=$('#scrCv',sh.el),x=cv.getContext('2d');const g=x.createLinearGradient(0,0,280,140);g.addColorStop(0,'#c9c9d1');g.addColorStop(.5,'#f2f2f7');g.addColorStop(1,'#a8a8b3');x.fillStyle=g;x.fillRect(0,0,280,140);x.fillStyle='#6b6b73';x.font='800 20px -apple-system,sans-serif';x.textAlign='center';x.fillText(T('SCRATCH HERE','यहाँ स्क्रैच करें'),140,78);

const chk=()=>{if(shown)return;const d=x.getImageData(0,0,280,140).data;let c=0,t=0;for(let i=3;i<d.length;i+=16){t++;if(d[i]<20)c++}if(c/t>.8){shown=true;cv.style.opacity=0;const r=$('#scrRes',sh.el);if(r){if(prize>0){confetti();r.innerHTML=`<span style="color:var(--green)">${T('You won','आपने जीते')} ${rupee(prize)}! 🎉</span>`}else r.textContent=T('Try again tomorrow 🍀','कल फिर कोशिश करें 🍀')}}};

function updProfile(){const u=S.user;if(!u||!$('#pHead'))return;const t=tierOf(u.matchesPlayed),mp=+u.matchesPlayed||0,vip=(+u.totalAdded||0)>=500;$('#pHead').innerHTML=`<button class="press" data-act="avatar" style="background:none;border:0">${av(u.username,u.avatarColor,84)}</button><div class="hd text-2xl mt-2">${esc(u.username)} ${vip?'⭐':''}</div><div class="sub text-sm">${esc(u.email)}</div><div class="inline-block mt-2 tag" style="background:${t.c}22;color:${t.c};font-size:13px;animation:float 2.4s infinite">${t.ic} ${tName(t)}</div><div class="sub text-xs mt-2 font-semibold">${T('Member since','सदस्य बने')} ${u.createdAt?new Date(ms(u.createdAt)).toLocaleDateString(lang==='hi'?'hi-IN':'en-IN',{month:'short',year:'numeric'}):'—'}</div><div class="grid grid-cols-3 gap-2 mt-4"><div class="rounded-xl p-3" style="background:var(--bg)"><div class="hd text-lg">${mp}</div><div class="sub text-xs font-bold">${T('Matches','मैच')}</div></div><div class="rounded-xl p-3" style="background:var(--bg)"><div class="hd text-lg">${Math.max(+u.wins||0,+u.statWins||0)}</div><div class="sub text-xs font-bold">${T('Wins','जीत')}</div></div><div class="rounded-xl p-3" style="background:var(--bg)"><div class="hd text-lg" style="color:var(--green)">${rupee(u.totalWon)}</div><div class="sub text-xs font-bold">${T('Earned','कमाई')}</div></div></div>`;
const n=t.next,pct=n?Math.round((mp-t.min)/(n.min-t.min)*100):100;$('#pRank').innerHTML=`<div class="flex justify-between items-center mb-2"><div class="font-extrabold">${t.ic} ${tName(t)}</div><div class="sub text-xs font-bold">${pct}%</div></div><div class="bar"><i style="--w:${pct}%;background:${t.c}"></i></div><div class="sub text-xs mt-2 font-semibold">${n?`${n.min-mp} ${T('matches to reach','मैच बाकी')} ${tName(n)} ${n.ic}`:T('Max rank reached! 👑','अधिकतम रैंक पहुँच गए! 👑')}</div>`;
if(S.refBy!==(u.referredBy||'')){S.refBy=u.referredBy||'';const code=u.referralCode||(S.uid||'').substring(0,6).toUpperCase();$('#pRef').innerHTML=`<div class="sec-h">👥 ${T('Refer & Earn','रेफर करें और कमाएं')}</div><div class="rounded-xl p-4 text-center" style="background:var(--bg)"><div class="sub text-xs font-bold">${T('Your code','आपका कोड')}</div><div class="hd mono" style="font-size:30px;letter-spacing:4px">${esc(code)}</div><div class="grid grid-cols-2 gap-2 mt-3"><button class="btn b-soft" data-act="copy" data-v="${esc(code)}">${T('Copy','कॉपी')}</button><button class="btn b-green" data-act="refShare">WhatsApp</button></div></div><div class="sub text-xs mt-2 font-semibold">💰 ${T('Earn ₹20 when a friend joins their first match','दोस्त के पहले मैच जॉइन करने पर ₹20 कमाएं')}</div><div class="flex items-center justify-between mt-2"><span class="font-bold text-sm" id="refCnt">${T("You've referred 0 friends","आपने 0 दोस्तों को रेफर किया")}</span><button class="chip" data-act="refTree">${T('View list','लिस्ट देखें')}</button></div>${u.referredBy?`<div class="rounded-xl p-3 mt-3 text-sm font-bold" style="background:rgba(52,199,89,.12);color:var(--green)">✓ ${T('Referral code applied','रेफरल कोड लगाया जा चुका')}</div>`:`<div class="flex gap-2 mt-3"><input id="refIn" class="inp" style="text-transform:uppercase" maxlength="10" placeholder="${T('Friend\'s code','दोस्त का कोड')}"><button class="btn b-blue" data-act="refApply">${T('Apply','लगाएं')}</button></div>`}`;if(S.refCount!=null)setRefCnt()}
const bd=u.badges||{};$('#pBadges').innerHTML=BADGES.map(b=>{const ok=!!bd[b.id];return `<button class="bdg press ${ok?'ok':'lock'}" data-act="badge" data-id="${b.id}"><div class="bi" style="font-size:34px">${b.ic}</div><div class="font-extrabold text-sm mt-1">${b.n[lang==='hi'?1:0]}</div><div class="text-xs sub font-semibold mt-1">${ok?'🔓 '+new Date(ms(bd[b.id])||Date.now()).toLocaleDateString(lang==='hi'?'hi-IN':'en-IN',{day:'numeric',month:'short'}):'🔒'}</div></button>`}).join('')}
function setRefCnt(){const e=$('#refCnt');if(e)e.textContent=T(`You've referred ${S.refCount} friends`,`आपने ${S.refCount} दोस्तों को रेफर किया`)}
async function loadRefCount(){try{const q=await db.collection('users').where('referredBy','==',S.uid).get();S.refCount=q.size;S.refList=q.docs.map(d=>d.data());setRefCnt();evalBadges()}catch(e){}}
ACT.refShare=()=>window.open('https://wa.me/?text='+encodeURIComponent(`Join ${S.br.appName||'Esports Arena'} and win real cash! Use my referral code ${S.user.referralCode} — ${location.href.split('#')[0]}`),'_blank','noopener');
ACT.refApply=async(d,btn)=>{const code=($('#refIn').value||'').trim().toUpperCase(),u=S.user;if(!code)return;if(u.referredBy)return toast(T('Referral already applied','रेफरल पहले ही लगाया जा चुका'),'error');if(code===u.referralCode)return toast(T('You cannot use your own code','आप अपना कोड इस्तेमाल नहीं कर सकते'),'error');if((+u.matchesPlayed||0)>0)return toast(T('Only valid before your first match','केवल पहले मैच से पहले मान्य'),'error');loading(btn,true);try{const q=await db.collection('users').where('referralCode','==',code).limit(1).get();if(q.empty||q.docs[0].id===S.uid){toast(T('Invalid referral code','अमान्य रेफरल कोड'),'error');loading(btn,false);return}await db.collection('users').doc(S.uid).update({referredBy:q.docs[0].id});toast(T('Referral applied!','रेफरल लग गया!'),'success')}catch(e){toast(T('Could not apply code','कोड नहीं लग सका'),'error');loading(btn,false)}};
ACT.refTree=()=>{const L=S.refList||[];sheet(`<div class="hd text-xl text-center mb-3">👥 ${T('Your Referrals','आपके रेफरल')}</div>${L.length?L.map(u=>`<div class="flex items-center gap-3 py-2" style="border-bottom:.5px solid var(--line)">${av(u.username,u.avatarColor,38)}<div class="flex-1"><div class="font-bold">${esc(u.username)}</div><div class="sub text-xs">${u.createdAt?new Date(ms(u.createdAt)).toLocaleDateString():''}</div></div><span class="tag" style="background:${u.referralRewardGiven?'rgba(52,199,89,.15)':'var(--chip)'};color:${u.referralRewardGiven?'var(--green)':'var(--sub)'}">${u.referralRewardGiven?T('Rewarded','इनाम मिला'):T('Pending','पेंडिंग')}</span></div>`).join(''):`<div class="sub text-center p-6">${T('No referrals yet','अभी कोई रेफरल नहीं')}</div>`}`)};
ACT.badge=d=>{const b=BADGES.find(x=>x.id===d.id),ok=!!(S.user.badges||{})[b.id];sheet(`<div class="text-center p-2"><div style="font-size:72px;${ok?'filter:drop-shadow(0 0 18px gold)':'filter:grayscale(1);opacity:.5'}" class="pop">${b.ic}</div><div class="hd text-xl mt-2">${b.n[lang==='hi'?1:0]}</div><div class="sub mt-1 font-semibold">${ok?T('Unlocked','अनलॉक'):T('Locked','लॉक')}</div><div class="rounded-xl p-3 mt-3 font-semibold" style="background:var(--bg)">💡 ${b.d[lang==='hi'?1:0]}</div><button class="btn b-blue w-full mt-4" data-act="close">${T('Close','बंद करें')}</button></div>`)};
ACT.avatar=()=>{const sh=sheet(`<div class="hd text-xl text-center mb-4">${T('Pick avatar color','अवतार का रंग चुनें')}</div><div class="grid grid-cols-6 gap-2">${PALETTE.map(c=>`<button class="press" data-act="setColor" data-c="${c}" style="aspect-ratio:1;border-radius:50%;background:${c};border:${(S.user.avatarColor||hashC(S.user.username))===c?'4px solid var(--text)':'0'}"></button>`).join('')}</div>`)};
ACT.setColor=async d=>{try{await db.collection('users').doc(S.uid).update({avatarColor:d.c});closeTop()}catch(e){toast(T('Failed','विफल'),'error')}};

/* ---------- Notifications ---------- */
const NI={win:'🏆',room:'🔓',withdraw:'✅',spin:'🎁',scratch:'🎁',referral:'👥',badge:'🏅',promo:'🎉',bonus:'🎁',deposit:'💳'};
ACT.bell=()=>{S.notesSheet=sheet('');drawNotes()};
function drawNotes(){const sh=S.notesSheet;if(!sh||sh.closed)return;const L=S.notes;sh.set(`<div class="flex items-center justify-between mb-3"><div class="hd text-xl">🔔 ${T('Notifications','सूचनाएं')}</div><button class="chip" data-act="markAll">${T('Mark all read','सब पढ़ा हुआ करें')}</button></div>${L.length?L.map(n=>`<button class="row press" data-act="goNote" data-id="${n.id}" style="${n.read?'':'background:rgba(0,122,255,.08);border-radius:12px'}"><span style="font-size:22px">${NI[n.type]||'🔔'}</span><span class="flex-1 text-sm"><span class="font-bold">${esc(n.text)}</span><br><span class="sub text-xs">${n.ts?fmtWhen(n.ts):''}</span></span>${n.read?'':'<i style="width:9px;height:9px;border-radius:50%;background:var(--blue)"></i>'}</button>`).join(''):`<div class="sub text-center p-8">${T('No notifications','कोई सूचना नहीं')}</div>`}`)}
ACT.markAll=async()=>{const b=db.batch();S.notes.filter(n=>!n.read).forEach(n=>b.update(db.collection('users').doc(S.uid).collection('notifications').doc(n.id),{read:true}));try{await b.commit()}catch(e){}};
ACT.goNote=d=>{const n=S.notes.find(x=>x.id===d.id);if(!n)return;if(!n.read)db.collection('users').doc(S.uid).collection('notifications').doc(n.id).update({read:true}).catch(()=>{});closeAllOverlays();const t=n.type;if(t==='win'){n.matchId&&S.mc[n.matchId]?openResults(n.matchId):setTab('matches')}else if(t==='room'||t==='promo'){n.matchId&&S.mc[n.matchId]&&S.joined[n.matchId]?openLobby(n.matchId):setTab('matches')}else if(['withdraw','spin','scratch','bonus','deposit'].includes(t))setTab('wallet');else if(t==='referral'||t==='badge')setTab('profile')};

/* ---------- Support / Report / Settings ---------- */
ACT.support=async()=>{const sh=sheet(`<div class="text-center p-6"><span class="spinner dk"></span></div>`);let L=[];try{const s=await db.collection('tickets').where('uid','==',S.uid).get();L=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>ms(b.createdAt)-ms(a.createdAt))}catch(e){}
const stl=s=>({open:[T('Open','खुला'),'var(--orange)'],in_progress:[T('In Progress','प्रक्रिया में'),'var(--blue)'],resolved:[T('Resolved','हल हुआ'),'var(--green)']})[s]||[s,'var(--sub)'];
const draw=()=>{sh.set(`<div class="hd text-xl text-center mb-3">🎧 ${T('Support','सहायता')}</div><button class="btn w-full mb-3 press" data-act="supWa" style="background:linear-gradient(135deg,#25D366,#128C7E)">💬 ${T('Chat on WhatsApp','WhatsApp पर चैट करें')} · +91 70860 90103</button><div class="card p-4" style="box-shadow:none;background:var(--bg)"><div class="font-extrabold mb-2">${T('New Ticket','नया टिकट')}</div><select id="tSub" class="inp mb-2">${[['Payment','भुगतान'],['Match','मैच'],['Account','खाता'],['Prize','इनाम'],['Other','अन्य']].map(o=>`<option value="${o[0]}">${T(o[0],o[1])}</option>`).join('')}</select><textarea id="tMsg" class="inp" maxlength="500" placeholder="${T('Describe your issue…','अपनी समस्या लिखें…')}"></textarea><div class="errmsg" id="tErr"></div><button class="btn b-blue w-full mt-2" data-act="ticketSend">${T('Submit','भेजें')}</button></div><div class="font-extrabold mt-4 mb-2">${T('Your Tickets','आपके टिकट')}</div>${L.length?L.map(t=>`<button class="row press" data-act="ticketView" data-id="${t.id}"><span class="flex-1"><span class="font-bold">${esc(t.subject)}</span><br><span class="sub text-xs">${fmtWhen(t.createdAt)}</span></span><span class="tag" style="background:var(--chip);color:${stl(t.status)[1]}">${stl(t.status)[0]}</span></button>`).join(''):`<div class="sub text-center p-4">${T('No tickets yet','अभी कोई टिकट नहीं')}</div>`}`)};draw();S.tickets=L;S.supSheet=sh;S.supDraw=draw;
sh.el.addEventListener('click',async e=>{const b=e.target.closest('[data-act=ticketSend]');if(!b)return;const msg=$('#tMsg',sh.el).value.trim(),err=$('#tErr',sh.el);if(msg.length<5){err.textContent=T('Please describe your issue','कृपया समस्या लिखें');return}if(S.tickets.some(t=>t.status==='open')){err.textContent=T('You already have an open ticket. Wait for a reply.','आपका एक टिकट पहले से खुला है। जवाब का इंतज़ार करें।');shake(sh.el);return}loading(b,true);try{const doc={uid:S.uid,username:S.user.username,subject:$('#tSub',sh.el).value,message:msg,status:'open',replies:[],createdAt:FV.serverTimestamp()};const r=await db.collection('tickets').add(doc);S.tickets.unshift(Object.assign({id:r.id},doc,{createdAt:Date.now()}));L=S.tickets;toast(T('Ticket submitted','टिकट भेजा गया'),'success');draw()}catch(er){toast(T('Failed to submit','भेजा नहीं जा सका'),'error');loading(b,false)}})};
ACT.ticketView=async d=>{let t=(S.tickets||[]).find(x=>x.id===d.id);try{const s=await db.collection('tickets').doc(d.id).get();if(s.exists)t=Object.assign({id:d.id},s.data())}catch(e){}if(!t)return;sheet(`<div class="hd text-lg">${esc(t.subject)}</div><div class="sub text-xs mb-3">${fmtWhen(t.createdAt)}</div><div class="msg me" style="max-width:100%">${esc(t.message)}</div>${(t.replies||[]).map(r=>`<div class="msg mt-2" style="max-width:100%"><small>${T('Admin reply','एडमिन का जवाब')}</small>${esc(r.text||r.message||'')}</div>`).join('')||`<div class="sub text-sm text-center mt-4">${T('Awaiting reply…','जवाब का इंतज़ार…')}</div>`}`)};
ACT.report=()=>{const sh=sheet(`<div class="hd text-xl text-center mb-3">🚩 ${T('Report a Player','खिलाड़ी रिपोर्ट करें')}</div><div class="fld"><label>${T('Tournament name','टूर्नामेंट का नाम')}</label><input id="rT" class="inp"></div><div class="fld"><label>${T('Player username','खिलाड़ी का यूज़रनेम')}</label><input id="rP" class="inp"></div><div class="fld"><label>${T('Reason','कारण')}</label><select id="rR" class="inp">${[['Hacking','हैकिंग'],['Team Kill','टीम किल'],['AFK','AFK'],['Fake UID','फर्जी UID'],['Other','अन्य']].map(o=>`<option value="${o[0]}">${T(o[0],o[1])}</option>`).join('')}</select></div><div class="errmsg" id="rE"></div><button class="btn b-red w-full mt-2" id="rGo">${T('Submit Report','रिपोर्ट भेजें')}</button>`);sh.el.addEventListener('click',async e=>{const b=e.target.closest('#rGo');if(!b)return;const t=$('#rT',sh.el).value.trim(),p=$('#rP',sh.el).value.trim();if(!t||!p){$('#rE',sh.el).textContent=T('Fill all fields','सभी फ़ील्ड भरें');shake(sh.el);return}loading(b,true);try{await db.collection('reports').add({reporterUid:S.uid,reporter:S.user.username,tournament:t,player:p,reason:$('#rR',sh.el).value,status:'new',ts:FV.serverTimestamp()});sh.set(`<div class="text-center p-6"><div style="font-size:52px" class="pop">✅</div><div class="font-bold mt-2">${T("Report submitted. We'll review within 24 hours.","रिपोर्ट भेज दी गई। हम 24 घंटे में समीक्षा करेंगे।")}</div><button class="btn b-blue w-full mt-4" data-act="close">${T('Done','ठीक है')}</button></div>`)}catch(er){toast(T('Failed to submit','भेजा नहीं जा सका'),'error');loading(b,false)}})};
ACT.settings=()=>{const sh=sheet('');S.setSheet=sh;drawSettings()};
function drawSettings(){const sh=S.setSheet;if(!sh||sh.closed)return;const on=!(S.user.notifPrefs&&S.user.notifPrefs.enabled===false),dark=document.documentElement.dataset.theme==='dark';sh.set(`<div class="hd text-xl text-center mb-2">⚙️ ${T('Settings','सेटिंग्स')}</div><div class="card overflow-hidden" style="box-shadow:none;background:var(--bg)"><button class="row" data-act="chgPw"><span class="flex-1">🔑 ${T('Change Password','पासवर्ड बदलें')}</span><span class="sub">›</span></button><div class="row"><span class="flex-1">🔔 ${T('Notifications','सूचनाएं')}</span><button class="sw ${on?'on':''}" data-act="togNotif" aria-label="notif"></button></div><div class="row"><span class="flex-1">🌙 ${T('Dark Mode','डार्क मोड')}</span><button class="sw ${dark?'on':''}" data-act="togDark" aria-label="dark"></button></div><div class="row"><span class="flex-1">🌐 ${T('Language','भाषा')}</span><button class="chip" data-act="togLang">${lang==='hi'?'हिन्दी → EN':'EN → हिन्दी'}</button></div><button class="row" data-act="install"><span class="flex-1">📲 ${T('Install App','ऐप इंस्टॉल करें')}</span><span class="sub">›</span></button><button class="row" data-act="delAcc" style="color:var(--red)"><span class="flex-1">🗑️ ${T('Request Account Deletion','खाता हटाने का अनुरोध')}</span></button></div><button class="btn b-red w-full mt-4" data-act="logout">${T('Logout','लॉग आउट')}</button>`)}
ACT.chgPw=async()=>{try{await auth.sendPasswordResetEmail(S.user.email);toast(T('Reset email sent to ','रीसेट ईमेल भेजा गया: ')+S.user.email,'success')}catch(e){toast(authErr(e.code),'error')}};
ACT.togNotif=async()=>{const on=!(S.user.notifPrefs&&S.user.notifPrefs.enabled===false);try{await db.collection('users').doc(S.uid).update({'notifPrefs.enabled':!on});setTimeout(drawSettings,250)}catch(e){}};
ACT.togDark=()=>{ACT.theme();drawSettings()};ACT.togLang=()=>{ACT.lang();drawSettings()};
ACT.install=async()=>{if(S.dip){S.dip.prompt();S.dip=null}else if(/iphone|ipad|ipod/i.test(navigator.userAgent))toast(T('Tap Share → Add to Home Screen','शेयर → होम स्क्रीन में जोड़ें दबाएं'),'info',5000);else toast(T('Use your browser menu → Install app','ब्राउज़र मेन्यू → ऐप इंस्टॉल करें'),'info',4500)};
ACT.delAcc=async()=>{if(!await confirmBox(T('Request account deletion? Our team will process it.','खाता हटाने का अनुरोध करें? हमारी टीम इसे प्रोसेस करेगी।'),T('Request','अनुरोध'),true))return;try{await db.collection('deleteRequests').add({uid:S.uid,email:S.user.email,username:S.user.username,status:'pending',ts:FV.serverTimestamp()});toast(T('Deletion request submitted','हटाने का अनुरोध भेजा गया'),'success')}catch(e){toast(T('Failed','विफल'),'error')}};
ACT.logout=async()=>{if(!await confirmBox(T('Are you sure you want to logout?','क्या आप लॉग आउट करना चाहते हैं?'),T('Logout','लॉग आउट'),true))return;closeAllOverlays();try{await auth.signOut()}catch(e){}};

/* ---------- Init ---------- */
buildIcons();applyStatic();
</script>
</body>
</html>
